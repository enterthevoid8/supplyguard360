services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - '127.0.0.1:19092:19092'
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'health']
      interval: 10s
      retries: 20
  api:
    build: ./apps/api
    env_file: .env
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres: {condition: service_healthy}
  publisher:
    build: ./apps/api
    command: ['node', 'dist/publisher.js']
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_started}
  local-worker:
    build: ./services/local-worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_started}
  web:
    build: ./apps/web
    env_file: .env
    environment:
      - INTERNAL_API_URL=http://api:4000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
volumes:
  pgdata:
